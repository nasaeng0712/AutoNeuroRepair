[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoneurorepair"
version = "0.1.0"
description = "Experimental self-healing EEG/BCI system"
requires-python = ">=3.11,<3.12"
dependencies = ["mne==1.11.0", "scikit-learn==1.9.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: Gate B; requires an actual A01T.gdf and MNE"]
